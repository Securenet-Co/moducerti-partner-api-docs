ription":"사업자등록증 파일 1개. PDF·JPG·PNG, 10MB(10,485,760바이트) 이하.\n형식은 파일 내용(시그니처)으로 확인합니다. 없으면 status가 review_required입니다.\n"}}},"encoding":{"data":{"contentType":"text/plain; charset=utf-8"},"businessRegistrationCertificate":{"contentType":"application/pdf, image/jpeg, image/png"}}}}},"responses":{"200":{"description":"접수됨(새 등록 또는 같은 등록의 재전송)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MemberReceipt"},"example":{"statusCode":200,"memberId":"b3a1c0de-0000-4000-8000-000000000001","status":"registered","registeredAt":"2026-11-19T03:15:00.000Z"}}}},"400":{"$ref":"#/components/responses/MemberValidationFailed"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/PartnerUnavailable"},"404":{"$ref":"#/components/responses/NotFound"},"413":{"$ref":"#/components/responses/FileTooLarge"},"429":{"$ref":"#/components/responses/TooManyRequests"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/ServiceUnavailable"}}}},"/partner/v1/members/{memberId}":{"get":{"tags":["members"],"operationId":"getMember","summary":"등록 확인","parameters":[{"name":"memberId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"등록 상태","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MemberView"},"example":{"statusCode":200,"memberId":"b3a1c0de-0000-4000-8000-000000000001","status":"registered","registeredAt":"2026-11-19T03:15:00.000Z","statusChangedAt":"2026-11-19T03:20:00.000Z"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"404":{"description":"MEMBER_NOT_FOUND(번호가 UUID가 아님·없음·다른 연동 서비스의 번호) 또는 PARTNER_API_DISABLED(파트너 API가 꺼진 환경)\n","headers":{"X-Trace-Id":{"$ref":"#/components/headers/TraceId"}},"content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"429":{"$ref":"#/components/responses/TooManyRequests"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/ServiceUnavailable"}}}},"/partner/v1/applications":{"post":{"tags":["applications"],"operationId":"createApplication","summary":"인증 신청","description":"회원·업체 등록으로 등록한 회원·업체(memberId)의 이름으로 인증 신청 1건을 사진과 함께 보냅니다.\n같은 연동 서비스(키 값이 아니라 키가 속한 연동 서비스) + 같은 externalOrderId를 다시 보내면\n같은 신청으로 봅니다. 같은 내용이면 처음 응답(같은 applicationId·receivedAt, status는 received)을\n그대로 돌려주고 사진을 다시 저장하지 않습니다. 다른 내용이면 409 EXTERNAL_ORDER_CONFLICT입니다.\n\"같은 내용\"은 data의 칸 값(앞뒤 공백을 지운 값, memberId는 대소문자 무시)과 사진 파일의 내용·보낸\n순서로 판단합니다(파일 이름·Content-Type은 보지 않음).\n재전송도 먼저 요청 모양, 사진 규칙과 data의 필수 칸·종류·길이·문자 규칙을 검사합니다.\n입력 오류는 400 VALIDATION_FAILED, 사진 크기 초과는 413 FILE_TOO_LARGE입니다. 이 검사를 통과하면 기존 신청의 내용을 대조합니다.\n응답의 status는 항상 received입니다. 지금 상태는 신청 조회로 확인해 주세요.\n\n현재 처리 단계는 (1) 키·호출 한도·API 사용 가능 여부 확인(401·429·503·404) (2) 요청 모양·입력 검사 (3) 같은 externalOrderId의 기존 신청\n확인 — 있으면 처음 응답 또는 409 EXTERNAL_ORDER_CONFLICT로 끝남 (4) 연동 서비스 확인 403\n(5) 새 신청의 memberId UUID 형식·등록 소유 확인 400(memberId / INVALID) 또는 담당자 확인 필요 409 MEMBER_REVIEW_REQUIRED (6) 사진 저장과 접수입니다.\n한 단계에서 여러 오류가 겹치면 어느 오류가 먼저 나올지는 보장하지 않습니다.\n\n이 파일이 표현하지 못하는 서버 규칙(최종 판단은 서버):\n- data는 문자열로 보내는 JSON이라, 그 안의 규격(CreateApplicationData)은 표준 검사·코드 생성 도구가\n  자동으로 연결하지 못합니다. data를 만들 때 CreateApplicationData를 직접 적용해 주세요.\n- data 상한 65,536은 UTF-8 바이트 수입니다(글자 수 아님).\n- data의 문자열은 앞뒤 공백을 지운 뒤 검사합니다(공백뿐인 필수 칸은 REQUIRED). NUL 문자가 있으면 FORMAT입니다.\n- 사진은 photos라는 같은 이름으로 1~5개를 반복해 보냅니다. 보낸 순서대로 저장하고 첫 번째가 대표 사진입니다.\n- 사진 형식은 파일 내용(시그니처)으로 확인합니다. JPG·PNG만 받습니다.\n","requestBody":{"required":true,"content":{"multipart/form-data":{"schema":{"type":"object","required":["data","photos"],"additionalProperties":false,"properties":{"data":{"type":"string","description":"CreateApplicationData 스키마(#/components/schemas/CreateApplicationData)의 JSON 문자열.\nUTF-8 바이트 기준 65,536바이트 이하(글자 수가 아님). 글자 부분은 이것 하나만 보냅니다.\n"},"photos":{"type":"array","minItems":1,"maxItems":5,"description":"제품 사진 1~5장. JPG·PNG, 장당 10MB(10,485,760바이트) 이하.\n형식은 파일 내용(시그니처)으로 확인합니다. 첫 번째 사진이 대표 사진입니다.\n","items":{"type":"string","format":"binary"}}}},"encoding":{"data":{"contentType":"text/plain; charset=utf-8"},"photos":{"contentType":"image/jpeg, image/png"}}}}},"responses":{"200":{"description":"접수됨(새 신청 또는 같은 신청의 재전송)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ApplicationReceipt"},"example":{"statusCode":200,"applicationId":"c4b2d1ef-0000-4000-8000-000000000002","externalOrderId":"ORDER-0001","status":"received","receivedAt":"2026-11-19T03:15:00.300Z"}}}},"400":{"$ref":"#/components/responses/ApplicationValidationFailed"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/PartnerUnavailable"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"413":{"$ref":"#/components/responses/FileTooLarge"},"429":{"$ref":"#/components/responses/TooManyRequests"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/ServiceUnavailable"}}},"get":{"tags":["applications"],"operationId":"listApplications","summary":"신청 조회 — 묶음 또는 전체 재대조 목록","description":"ids 또는 externalOrderIds를 보내면 묶음 조회(최대 50건, 응답 ApplicationBatch)이고,\n둘 다 없으면 전체 재대조 목록(쪽 단위, 응답 ApplicationPage)입니다. 같은 연동 서비스로 보낸 신청만 보입니다.\n\n묶음 조회: ids와 externalOrderIds를 함께 보내면 400 VALIDATION_FAILED(externalOrderIds / INVALID).\n중복을 뺀 개수가 50건을 넘으면 400 TOO_MANY_IDS. 없는 신청·다른 연동 서비스의 신청·UUID가 아닌 ids\n항목은 앞뒤 공백을 지운 값으로 notFound에 담깁니다. 묶음에서는 after·limit·state·updatedSince를 생략해 주세요.\n함께 보내면 after의 길이·NUL, limit의 숫자 형식, state의 허용값, updatedSince의 문자열 형식을 검사합니다(위반 시 400 VALIDATION_FAILED).\n이 검사를 통과하면 묶음에서는 네 값을 무시합니다. 실제 날짜와 커서 값은 목록에서만 확인합니다.\n\n전체 재대조 목록: 정렬은 접수 시각이 이른 것부터(같으면 applicationId 순)이고 상태가 바뀌어도 순서는\n변하지 않습니다. 응답의 nextAfter가 null이 아니면 같은 쿼리에 after=\u003cnextAfter>를 넣어 다음 쪽을\n부릅니다. state·updatedSince 없이 끝까지 읽으면 읽는 도중 상태가 바뀐 신청도 빠지지 않습니다.\n필터를 켠 목록은 쪽마다 그 시점의 상태로 다시 거르므로 빠짐없는 대조에는 쓰지 마세요.\n","parameters":[{"name":"ids","in":"query","required":false,"description":"모두의인증 신청 번호(applic

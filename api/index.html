<script type="application/json" id="openapi-spec">{"openapi":"3.0.3","info":{"title":"모두의인증 연동 API","version":"1.2","description":"모두의인증 연동 API 규격 버전 1.2(2026-11-24)입니다. 회원·업체 등록, 등록 확인, 인증 신청, 신청 조회를 담았습니다.\n버전 1.1에서 등록 status가 registered·certificate_required·on_hold 세 가지가 되었습니다.\n버전 1.0의 review_required는 certificate_required로 이름이 바뀌었습니다(뜻은 같음).\n발급 문서 내려받기·웹훅·정산은 준비 중이며, 열리는 대로 이 파일의 다음 버전에 이어 붙입니다.\n같은 버전의 안내 문서(모두의인증 연동 API 문서, 버전 1.2)와 내용이 같습니다.\n"},"servers":[{"url":"{baseUrl}","description":"안내받은 환경 주소. 주소는 연동사마다 따로 안내합니다","variables":{"baseUrl":{"default":"https://partner-api.example.com","description":"안내받은 주소로 바꿔 쓰세요(기본값은 자리 값)"}}}],"security":[{"ApiKey":[]}],"tags":[{"name":"members","description":"회원·업체 등록, 등록 확인"},{"name":"applications","description":"인증 신청, 신청 조회"}],"paths":{"/partner/v1/members":{"post":{"tags":["members"],"operationId":"registerMember","summary":"회원·업체 등록","description":"신청자(회원)와 그 업체를 한 번 등록합니다. 같은 연동 서비스(키 값이 아니라 키가 속한 연동 서비스) +\n같은 이메일(대소문자 무시) + 같은 사업자등록번호(숫자만)를 다시 보내면 처음 memberId와 지금\nstatus를 그대로 돌려줍니다(다른 칸·파일은 바꾸지 않음). 다시 보낸 요청도 입력 규칙을 모두\n통과해야 하며, 맞지 않으면 기존 등록과 상관없이 입력 오류는 400 VALIDATION_FAILED,\n사업자등록증 파일 크기 초과는 413 FILE_TOO_LARGE입니다.\non_hold인 등록을 다시 보내면 처리하지 않고 같은 status·holdReason·message를 그대로 돌려줍니다(파일을 실어도 저장하지 않음).\n예외 둘: 처음 등록이 certificate_required(사업자등록증 없음)였고 사업자등록증을 실어 다시 보낸 경우, 그리고 registered인데\n이어져 있던 회원 또는 업체가 모두의인증에서 삭제된 경우(파일 없이 보내면 certificate_required로 돌아감)에는 그 요청의\n내용(필수 칸을 갖춘 data + 사업자등록증)으로 같은 memberId에서 처음부터 새로 처리하고 결과는 세 상태 중 하나입니다.\n이 경우 연동 서비스가 새 등록을 받을 수 없는 상태면 403 PARTNER_UNAVAILABLE입니다.\n\nstatus는 세 가지입니다. registered(등록이 끝남. 인증 신청 때 이어진 회원·업체를 다시 확인해 통과하면 접수, 아니면 409),\ncertificate_required(사업자등록증 파일이 없어 멈춤. 버전 1.0의 review_required), on_hold(모두의인증 담당자 확인 중.\n이때만 holdReason과 고정 message가 실리고 신청은 409 MEMBER_REVIEW_REQUIRED). 모두의인증에 이미 있는 회원·업체의\n구체적인 상태는 응답에 나오지 않습니다.\n연동 등록으로는 모두의인증 업체 직원 가입이 생기지 않습니다. 같은 사업자등록번호의 승인된 일반 업체가 한 곳이면 신청만 그 업체로 이어지고(신청 때 업체 상태를 다시 확인해 통과하지 못하면 409),\n없어서 새로 만든 업체에도 직원이 없습니다(신청자가 첫 마스터가 되지 않음). 웹 자료 열람은 고객이 모두의인증 웹에서 직접 소속을\n신청해 그 업체 마스터가 승인하거나, 마스터가 없으면 모두의인증 담당자가 승인해야 합니다. 이미 그 업체의 승인된 직원인 고객은 그대로 봅니다.\ncertificate_required(사업자등록증 없음)는 업체를 이어 붙이지 않습니다.\n가입 상태 변경 알림(웹훅)은 추후 제공 예정입니다. 그 전에는 등록 확인(GET)으로 확인해 주세요.\nmemberId는 사용자 한 명마다 하나가 아니라 (회원 이메일, 업체 사업자등록번호) 한 쌍마다 하나입니다. 한 사람이 업체 두 곳으로\n등록하면 memberId도 두 개이므로, 연동사 쪽에서는 이 쌍 단위로 저장해 주세요.\n신청자가 그 업체 소속인지와 그 이메일의 주인인지는 연동사가 확인한 뒤 보내 주세요.\n\n이 파일이 표현하지 못하는 서버 규칙(최종 판단은 서버):\n- data는 문자열로 보내는 JSON이라, 그 안의 규격(RegisterMemberData)은 표준 검사·코드 생성 도구가\n  자동으로 연결하지 못합니다. data를 만들 때 RegisterMemberData를 직접 적용해 주세요.\n- data 상한 65,536은 UTF-8 바이트 수입니다(글자 수 아님).\n- 문자열은 앞뒤 공백을 지운 뒤 검사합니다(공백뿐인 필수 칸은 REQUIRED).\n- agreedAt은 달력에 없는 날짜·시각이나 1900~2200 밖 연도면 FORMAT입니다.\n","requestBody":{"required":true,"content":{"multipart/form-data":{"schema":{"type":"object","required":["data"],"additionalProperties":false,"properties":{"data":{"type":"string","description":"RegisterMemberData 스키마(#/components/schemas/RegisterMemberData)의 JSON 문자열.\nUTF-8 바이트 기준 65,536바이트 이하(글자 수가 아님). 글자 부분은 이것 하나만 보냅니다.\n"},"businessRegistrationCertificate":{"type":"string","format":"binary","description":"사업자등록증 파일 1개. PDF·JPG·PNG, 10MB(10,485,760바이트) 이하.\n형식은 파일 내용(시그니처)으로 확인합니다. 없으면 status가 certificate_required입니다.\n"}}},"encoding":{"data":{"contentType":"text/plain; charset=utf-8"},"businessRegistrationCertificate":{"contentType":"application/pdf, image/jpeg, image/png"}}}}},"responses":{"200":{"description":"접수됨(새 등록 또는 같은 등록의 재전송)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MemberReceipt"},"examples":{"registered":{"summary":"등록이 끝남","value":{"statusCode":200,"memberId":"b3a1c0de-0000-4000-8000-000000000001","status":"registered","registeredAt":"2026-11-21T03:15:00.000Z"}},"certificateRequired":{"summary":"사업자등록증 파일이 없어 멈춤","value":{"statusCode":200,"memberId":"b3a1c0de-0000-4000-8000-000000000002","status":"certificate_required","registeredAt":"2026-11-21T03:15:00.000Z"}},"onHold":{"summary":"모두의인증 담당자 확인 중 — 사업자 정보(holdReason·message는 이때만). 아래 등록 확인(GET) 예시의 onHold와 같은 등록입니다","value":{"statusCode":200,"memberId":"b3a1c0de-0000-4000-8000-000000000003","status":"on_hold","registeredAt":"2026-11-21T03:15:00.000Z","holdReason":"COMPANY_UNAVAILABLE","message":"입력하신 사업자 정보는 모두의인증 확인이 필요합니다. 사업자등록번호를 확인하시거나 고객센터로 문의해 주세요."}},"onHoldAccount":{"summary":"모두의인증 담당자 확인 중 — 이메일 계정(다른 등록)","value":{"statusCode":200,"memberId":"b3a1c0de-0000-4000-8000-000000000004","status":"on_hold","registeredAt":"2026-11-21T03:15:00.000Z","holdReason":"ACCOUNT_UNAVAILABLE","message":"입력하신 이메일 계정은 모두의인증 확인이 필요합니다. 이메일을 확인하시거나 고객센터로 문의해 주세요."}}}}}},"400":{"$ref":"#/components/responses/MemberValidationFailed"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/PartnerUnavailable"},"404":{"$ref":"#/components/responses/NotFound"},"413":{"$ref":"#/components/responses/FileTooLarge"},"429":{"$ref":"#/components/responses/TooManyRequests"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/ServiceUnavailable"}}}},"/partner/v1/members/{memberId}":{"get":{"tags":["members"],"operationId":"getMember","summary":"등록 확인","description":"등록 응답과 같은 status·holdReason·message(on_hold일 때만)에 statusChangedAt이 더해집니다.\n담당자가 on_hold를 풀면 registered로 바뀌고 holdReason·message 칸이 사라집니다.\n등록한 뒤에 이어진 회원·업체의 상태가 바뀌어도 이 값은 따라 바뀌지 않으며, 그 경우 신청 때 다시 확인에서 막히면 409입니다.\n","parameters":[{"name":"memberId","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"등록 상태","content":{"application/json":{"schema":{"$ref":"#/components/schemas/MemberView"},"examples":{"registered":{"summary":"등록이 끝남","value":{"statusCode":200,"memberId":"b3a1c0de-0000-4000-8000-000000000001","status":"registered","registeredAt":"2026-11-21T03:15:00.000Z","statusChangedAt":"2026-11-21T03:20:00.000Z"}},"onHold":{"summary":"모두의인증 담당자 확인 중 — 위 등록 응답(POST)의 onHold와 같은 등록입니다. 처음 등록된 채 그대로라 statusChangedAt이 registeredAt과 같습니다","
